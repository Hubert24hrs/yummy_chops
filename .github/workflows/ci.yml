name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.47.1"

jobs:
  api:
    name: API (unit + integration on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gudmeal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --python 3.13
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL — triggers, deferred balance constraint, row locks)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gudmeal_test
        run: uv run pytest -q tests/integration
      - name: Alembic upgrade / drift check / downgrade
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gudmeal_test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "DROP DATABASE IF EXISTS gudmeal_migrate" -c "CREATE DATABASE gudmeal_migrate"
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/gudmeal_migrate uv run alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/gudmeal_migrate uv run alembic check
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/gudmeal_migrate uv run alembic downgrade base

  agents:
    name: Agents (LangGraph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  emulators:
    name: Firebase rules + Firestore adapter (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: npm ci
      - run: npm install -g firebase-tools@14
      - run: (cd services/api && uv sync --frozen --python 3.13)
      - name: Rules tests + DocumentStore contract tests against the Firestore emulator
        working-directory: firebase
        run: >
          firebase emulators:exec --only firestore,storage --project demo-gudmeal-rules
          "npx vitest run --dir tests && cd ../services/api && uv run pytest -q tests/integration/test_store_contract.py"

  web:
    name: Web apps (tests + production builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node packages/tokens/build.mjs && git diff --exit-code -- packages/tokens mobile/core/lib/src/theme
      - run: npx vitest run --root packages/api-client
      - run: npx vitest run --root apps/web
      - run: npx vitest run --root apps/partner
      - run: npx vitest run --root apps/admin
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  flutter:
    name: Flutter (core, customer, rider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze & test
        run: |
          for pkg in mobile/core mobile/customer mobile/rider; do
            echo "::group::$pkg"
            (cd "$pkg" && flutter pub get && flutter analyze && flutter test) || exit 1
            echo "::endgroup::"
          done

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gudmeal-api:ci services/api
      - run: docker build -t gudmeal-agents:ci services/agents
      - name: Smoke-test API image
        run: |
          docker run -d --name api -p 8080:8080 -e ENVIRONMENT=local -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db gudmeal-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/v1/health && break; sleep 1; done
          curl -sf "localhost:8080/v1/restaurants?limit=1" | head -c 200
          docker logs api | tail -5

  websites:
    name: Website image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, partner, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run image (demo settings)
        run: |
          docker build -f infra/docker/web.Dockerfile -t "gudmeal-${{ matrix.app }}:ci" \
            --build-arg APP=${{ matrix.app }} \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:8080 \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_AGENTS_URL=http://localhost:8100 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=demo-api-key \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-gudmeal.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-gudmeal \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:demo \
            .
      - name: Smoke-test the image (page and a static asset; the API is not running)
        run: |
          docker run -d --name site -p 8080:8080 -e API_URL=http://localhost:8000 "gudmeal-${{ matrix.app }}:ci"
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sL -o page.html -w '%{http_code}' localhost:8080/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          echo "GET / -> $code"
          [ "$code" = 200 ] || { docker logs site; exit 1; }
          asset=$(grep -o '/_next/static/[^"]*\.js' page.html | head -1)
          echo "GET $asset"
          curl -sf -o /dev/null "localhost:8080$asset"
          docker exec site id -un
          docker logs site | tail -5
