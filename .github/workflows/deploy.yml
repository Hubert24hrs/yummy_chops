name: Deploy to Cloud Run

# Manual, environment-gated deployments. Configure GitHub Environments "development", "staging" and
# "production" (production with required reviewers) and these per-environment variables/secrets:
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.ARTIFACT_REPO
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER, secrets.GCP_DEPLOY_SERVICE_ACCOUNT   (Workload Identity Federation — no JSON keys)
# Website settings (public values compiled into the browser code; see docs/DEPLOYMENT.md):
#   vars.FIREBASE_API_KEY, vars.FIREBASE_APP_ID (Firebase web app), optional vars.FIREBASE_AUTH_DOMAIN
#   vars.APP_CHECK_SITE_KEY (reCAPTCHA Enterprise; required for production, where the API enforces App Check)
#   optional vars.MAPS_BROWSER_KEY, and custom domains vars.API_URL / AGENTS_URL / WEB_URL / PARTNER_URL / ADMIN_URL
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, staging, production]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.ARTIFACT_REPO }}
      TAG: ${{ github.sha }}
      API_URL: ${{ vars.API_URL }}
      AGENTS_URL: ${{ vars.AGENTS_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      PARTNER_URL: ${{ vars.PARTNER_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build & push images (Cloud Build)
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
          MAPS_BROWSER_KEY: ${{ vars.MAPS_BROWSER_KEY }}
          TARGET: ${{ inputs.environment }}
        run: |
          source infra/scripts/urls.sh
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Set the FIREBASE_API_KEY and FIREBASE_APP_ID variables of this GitHub Environment" >&2; exit 1
          fi
          if [ "$TARGET" = production ] && [ -z "$APP_CHECK_SITE_KEY" ]; then
            echo "Set APP_CHECK_SITE_KEY: the production API refuses signed-in calls without App Check" >&2; exit 1
          fi
          gcloud builds submit --project "$PROJECT" --config infra/cloudbuild/cloudbuild.yaml \
            --substitutions "_REGION=$REGION,_REPO=$REPO,_TAG=$TAG,_API_URL=$API_URL,_AGENTS_URL=$AGENTS_URL,_WEB_URL=$WEB_URL,_PARTNER_URL=$PARTNER_URL,_ADMIN_URL=$ADMIN_URL,_FIREBASE_API_KEY=$FIREBASE_API_KEY,_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-$PROJECT.firebaseapp.com},_FIREBASE_PROJECT_ID=$PROJECT,_FIREBASE_APP_ID=$FIREBASE_APP_ID,_APP_CHECK_SITE_KEY=$APP_CHECK_SITE_KEY,_MAPS_BROWSER_KEY=$MAPS_BROWSER_KEY" .
      - name: Run database migrations (Cloud Run job)
        run: |
          gcloud run jobs deploy gudmeal-migrate --project "$PROJECT" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT/$REPO/gudmeal-api:$TAG" \
            --service-account "gudmeal-api@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$PROJECT:$REGION:gudmeal-sql" \
            --set-secrets "DATABASE_URL=api-database-url:latest" \
            --command alembic --args upgrade,head
          gcloud run jobs execute gudmeal-migrate --project "$PROJECT" --region "$REGION" --wait
      - name: Deploy services and websites
        run: infra/scripts/deploy.sh "${{ inputs.environment }}" "$PROJECT" "$REGION" "$REPO" "$TAG"
